
# --- Provider default (Plan 5) ---
quark.provider.default=gemini
%test.quark.provider.default=gemini

# --- Gemini (Plan 1, logical name "gemini" since Plan 5 / @ModelName) ---
# quarkus-langchain4j requires provider disambiguation when multiple extensions on classpath.
quarkus.langchain4j.gemini.chat-model.provider=ai-gemini
quarkus.langchain4j.ai.gemini.gemini.api-key=${GEMINI_API_KEY:}
quarkus.langchain4j.ai.gemini.gemini.chat-model.model-id=gemini-2.0-flash-lite

# Tests must boot without real secrets.
%test.quarkus.langchain4j.ai.gemini.gemini.api-key=test-key

# --- NIM (Plan 5) — OpenAI-compatible endpoint, logical name "nim" ---
# quarkus-langchain4j requires provider disambiguation when multiple extensions on classpath.
quarkus.langchain4j.nim.chat-model.provider=openai
quarkus.langchain4j.openai.nim.base-url=https://integrate.api.nvidia.com/v1
quarkus.langchain4j.openai.nim.api-key=${NIM_API_KEY:}
quarkus.langchain4j.openai.nim.chat-model.model-name=meta/llama-3.1-8b-instruct

# Tests: NIM gateway is never invoked in tests (default provider = gemini).
%test.quarkus.langchain4j.openai.nim.api-key=test-nim-key

# --- Telegram (Plan 1) ---
quark.telegram.enabled=${QUARK_TELEGRAM_ENABLED:true}
quark.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
quark.telegram.poll-timeout-seconds=30

# Base URL embeds the bot token. Read timeout must exceed long-poll timeout.
quarkus.rest-client.telegram.url=https://api.telegram.org/bot${quark.telegram.bot-token}
quarkus.rest-client.telegram.read-timeout=40000

# Tests never poll Telegram.
%test.quark.telegram.enabled=false
%test.quark.telegram.bot-token=test-token

# --- Streaming (Plan 3) ---
quark.telegram.stream-throttle-ms=750
%test.quark.telegram.stream-throttle-ms=0

# --- Memory (Plan 2 window size, runtime-owned since Plan 4 / ADR 0007) ---
quark.memory.max-messages=20
