name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build & test (Temurin 25)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Gradle version
        run: ./gradlew --version

      - name: Spotless check
        id: spotless
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --stacktrace --info spotlessCheck 2>&1 | tee /tmp/spotless-check.log

      - name: Spotless diagnostic (post stderr+diff to PR on failure)
        if: steps.spotless.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Capture spotlessCheck tail (the failing run).
          CHECK_TAIL="$(tail -150 /tmp/spotless-check.log 2>/dev/null || echo '(spotless-check.log missing)')"
          # Run apply with full output capture (no || mask).
          APPLY_OUT="$(./gradlew --stacktrace spotlessApply 2>&1 || true)"
          APPLY_TAIL="$(printf '%s' "$APPLY_OUT" | tail -120)"
          DIFF="$(git --no-pager diff --no-color | head -c 20000)"
          [ -z "$DIFF" ] && DIFF="(no diff — apply did not modify files)"
          {
            printf '## Spotless CI diagnostic\n\n'
            printf 'Run: %s\n\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf '### spotlessCheck stderr (last 150 lines)\n```\n%s\n```\n\n' "$CHECK_TAIL"
            printf '### spotlessApply stderr (last 120 lines)\n```\n%s\n```\n\n' "$APPLY_TAIL"
            printf '### Diff that spotlessApply produced\n```diff\n%s\n```\n' "$DIFF"
          } > /tmp/diag.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/diag.md
          git checkout -- . 2>/dev/null || true

      - name: Test
        id: test
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace test

      - name: Fail if any required step failed
        if: steps.spotless.outcome == 'failure' || steps.test.outcome == 'failure'
        run: |
          echo "Job result summary:"
          echo "  spotless: ${{ steps.spotless.outcome }}"
          echo "  test:     ${{ steps.test.outcome }}"
          echo "(diagnostic comments posted to PR on failure of spotless step)"
          exit 1

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "**/build/test-results/test/TEST-*.xml"
          require_tests: false

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
