name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build & test (Temurin 25)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Spotless check
        id: spotless
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace spotlessCheck

      - name: Spotless diagnostic (post diff to PR on failure)
        if: steps.spotless.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon spotlessApply || true
          DIFF="$(git --no-pager diff --no-color | head -c 50000)"
          if [ -z "$DIFF" ]; then
            DIFF="(spotlessApply produced no diff — Spotless is failing for a non-formatting reason; check the spotlessCheck step log)"
          fi
          {
            printf '## Spotless CI diagnostic (auto-posted)\n\n'
            printf 'Run: %s\n\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf 'Diff that `./gradlew spotlessApply` would produce on Temurin 25:\n\n'
            printf '```diff\n%s\n```\n' "$DIFF"
          } > /tmp/diag.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/diag.md
          git checkout -- . || true

      - name: Test
        id: test
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace test

      - name: Fail if any required step failed
        if: steps.spotless.outcome == 'failure' || steps.test.outcome == 'failure'
        run: |
          echo "Job result summary:"
          echo "  spotless: ${{ steps.spotless.outcome }}"
          echo "  test:     ${{ steps.test.outcome }}"
          echo "(diagnostic comments posted to PR on failure of spotless step)"
          exit 1

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "**/build/test-results/test/TEST-*.xml"
          require_tests: false

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
