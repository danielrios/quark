# =============================================================================
# docker-compose.claude.yml — Claude Code multi-model loop environment
#
# NOTE: scripts/loop.sh is the canonical launcher (no compose dependency, and it
# also propagates personal skills into the container — see ADR 0007). This file
# is a best-effort alternative for hosts that have the docker compose v2 plugin;
# it does NOT perform the ~/.claude.json skill-registration step loop.sh does.
#
# Usage:
#   docker compose -f docker-compose.claude.yml build      # build the image
#   docker compose -f docker-compose.claude.yml run --rm claude-loop \
#     scripts/orchestrate.sh --feature "Plan 3 — Telegram streaming"
# See: docs/adr/0007-multi-model-loop-harness.md
# =============================================================================

services:
  claude-loop:
    build:
      context: .
      dockerfile: Dockerfile.claude-loop
    user: "claude"

    volumes:
      # Project source (read-write)
      - .:/workspace:z

      # Persistent auth + plugins + skill symlinks — mapped from host
      - ~/.claude:/home/claude/.claude:z

      # Symlink targets for personal skills. ~/.claude/skills/* are relative
      # symlinks into ~/.agents/skills/*; without this mount they dangle and
      # caveman / cavecrew / Matt Pocock skills silently vanish in-container.
      - ~/.agents:/home/claude/.agents:z

      # Gradle cache — avoids re-downloading deps every run
      - gradle-cache:/home/claude/.gradle

      # JBang cache — keeps quarkus-agent MCP jar cached
      - jbang-cache:/home/claude/.jbang

    # Full internet access: Anthropic API, Maven Central, npm, GitHub
    network_mode: bridge

    environment:
      # Auth: set in .env or pass via CLI
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # context7 MCP key — referenced by .mcp.json as ${CONTEXT7_API_KEY}.
      # Never hardcode; set it in .env (gitignored) or the host environment.
      - CONTEXT7_API_KEY=${CONTEXT7_API_KEY:-}

      # Context optimization
      - BASH_MAX_OUTPUT_LENGTH=15000

      # Disable non-essential telemetry inside container
      - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1

      # Timezone for readable logs
      - TZ=America/Sao_Paulo

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

    tty: true
    stdin_open: true

volumes:
  gradle-cache:
    name: quark-gradle-cache
  jbang-cache:
    name: quark-jbang-cache
